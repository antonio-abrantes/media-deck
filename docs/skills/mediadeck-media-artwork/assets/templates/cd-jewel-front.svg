<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="120mm" viewBox="0 0 1417 1417">
  <title>MediaDeck CD jewel case front insert template, 120 millimetres square</title>
  <metadata>300 PPI target; remove or hide the guides group before export.</metadata>
  <g id="guides" fill="none" pointer-events="none">
    <rect x="0.5" y="0.5" width="1416" height="1416" stroke="#ff3ea5" stroke-width="1"/>
    <rect x="35" y="35" width="1347" height="1347" stroke="#36f5d0" stroke-width="2" stroke-dasharray="18 12"/>
  </g>
</svg>
